name: Static Site CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate captured HTML document
        shell: python
        run: |
          import html.parser
          from pathlib import Path
          candidates = sorted(Path(".").glob("*.html"))
          if not candidates:
              raise SystemExit("No HTML entry document found at repository root")
          parser = html.parser.HTMLParser()
          for path in candidates:
              parser.feed(path.read_text(encoding="utf-8"))
              parser.close()
              parser.reset()
              print(f"{path}: parsed successfully")
